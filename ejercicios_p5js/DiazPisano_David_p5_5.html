
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Mi creación estática</title>
  <script src="https://cdn.jsdelivr.net/npm/p5@1.9.0/lib/p5.min.js"></script>
</head>

<body>
<script>

function setup() {
  createCanvas(800, 600);
}

function draw() {

  // 1. CIELO
  background(135, 206, 235);

  // 2. SOL
  noStroke();
  fill(255, 220, 50);
  circle(680, 90, 90);

  // 3. NUBES
  fill(255);
  ellipse(130, 100, 90, 45);
  ellipse(170, 90, 85, 55);
  ellipse(210, 105, 90, 40);

  ellipse(400, 140, 80, 40);
  ellipse(440, 125, 90, 55);
  ellipse(480, 140, 80, 40);

  // 4. MONTAÑAS
  fill(90, 130, 100);
  triangle(0, 370, 180, 120, 360, 370);

  fill(110, 150, 110);
  triangle(230, 370, 470, 100, 700, 370);

  fill(80, 120, 90);
  triangle(520, 370, 700, 170, 800, 370);

  // NIEVE DE LAS MONTAÑAS
  fill(255);
  triangle(145, 170, 180, 120, 220, 175);
  triangle(425, 150, 470, 100, 515, 155);

  // 5. CAMPO
  noStroke();
  fill(75, 175, 85);
  rect(0, 350, 800, 250);

  // 6. RÍO
  fill(60, 170, 220);
  beginShape();
  vertex(0, 480);
  vertex(180, 430);
  vertex(350, 470);
  vertex(500, 420);
  vertex(800, 450);
  vertex(800, 600);
  vertex(0, 600);
  endShape(CLOSE);

  // 7. CARRETERA
  fill(90, 90, 90);
  quad(280, 600, 390, 600, 460, 350, 420, 350);

  stroke(255);
  strokeWeight(5);
  line(335, 570, 335, 535);
  line(355, 480, 355, 445);
  line(380, 400, 380, 375);

  // 8. ÁRBOL IZQUIERDO
  noStroke();
  fill(110, 65, 30);
  rect(75, 300, 30, 100);

  fill(25, 115, 45);
  circle(90, 280, 100);
  circle(55, 310, 70);
  circle(125, 310, 70);

  // 9. ÁRBOL DERECHO
  fill(110, 65, 30);
  rect(680, 300, 30, 100);

  fill(30, 130, 55);
  circle(695, 270, 110);
  circle(655, 300, 75);
  circle(735, 300, 75);

  // 10. FLORES
  noStroke();

  for (let i = 0; i < 12; i++) {
    let x = random(20, 260);
    let y = random(390, 445);

    fill(255, 80, 130);
    circle(x, y, 10);

    fill(255, 220, 30);
    circle(x, y, 4);
  }

  // 11. DETALLES DEL RÍO
  stroke(255);
  strokeWeight(2);
  line(50, 520, 120, 510);
  line(150, 550, 220, 540);
  line(550, 500, 620, 490);

  // 12. ARCO DECORATIVO
  noFill();
  stroke(255, 255, 255);
  strokeWeight(3);
  arc(600, 440, 70, 35, 0, radians(180));

  // 13. CONTORNO DE UN DETALLE
  stroke(30, 90, 40);
  strokeWeight(2);
  noFill();
  ellipse(90, 280, 105, 105);

  // 14. FINAL
  noLoop();
}

</script>
</body>
</html>
