
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Práctica 6 - Mi póster</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
</head>
<body>
<script>
function setup() {
    createCanvas(800, 500);
    background(240);
    noStroke();

    // Título.
    textSize(28);
    textAlign(CENTER, TOP);
    fill(20, 50, 120);
    text("MI MUNDO GAMER", 320, 16);

    // Subtítulo.
    textSize(16);
    fill(180, 60, 30);
    text("Los videojuegos son mi pasion", 320, 52);

    // Etiquetas de las esquinas.
    textSize(12);
    fill(0);

    textAlign(LEFT, TOP);
    text("(0, 0)", 6, 6);

    textAlign(RIGHT, TOP);
    text("(640, 0)", 634, 6);

    textAlign(LEFT, BOTTOM);
    text("(0, 360)", 6, 354);

    textAlign(RIGHT, BOTTOM);
    text("(640, 360)", 634, 354);

    // Texto del centro.
    textAlign(CENTER, CENTER);
    textSize(12);
    fill(30);
    text("Centro (320, 180)", 320, 180);
}
</script>
</body>
</html>
