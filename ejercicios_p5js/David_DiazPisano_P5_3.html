
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Práctica 3 - Mi casa</title>

  <!-- Cargamos la biblioteca p5.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
</head>

<body>
<script>
function setup() {
  // Creamos el lienzo de 400 x 400 píxeles
  createCanvas(400, 400);

  // FONDO
  background(200);

  // PAREDES
  stroke(100, 60, 30);
  strokeWeight(3);
  fill(240, 210, 160);
  rect(90, 145, 220, 210);

  // TEJADO
  stroke(120, 35, 25);
  strokeWeight(3);
  fill(190, 55, 45);
  triangle(65, 165, 200, 65, 335, 165);

  // PUERTA
  stroke(90, 45, 20);
  strokeWeight(3);
  fill(150, 85, 40);
  rect(165, 255, 70, 100);

  // Manilla de la puerta
  stroke(255, 210, 50);
  strokeWeight(5);
  point(222, 305);

  // VENTANA IZQUIERDA
  stroke(100, 60, 30);
  strokeWeight(4);
  fill(130, 210, 240);
  rect(110, 200, 65, 55);

  // Divisiones de la ventana izquierda
  stroke(100, 60, 30);
  strokeWeight(3);
  line(142.5, 200, 142.5, 255);
  line(110, 227.5, 175, 227.5);

  // VENTANA DERECHA
  stroke(100, 60, 30);
  strokeWeight(4);
  fill(130, 210, 240, 220);
  rect(225, 200, 65, 55);

  // Divisiones de la ventana derecha
  stroke(100, 60, 30);
  strokeWeight(3);
  line(257.5, 200, 257.5, 255);
  line(225, 227.5, 290, 227.5);

  // SUELO
  stroke(70, 110, 60);
  strokeWeight(3);
  line(30, 355, 370, 355);
}
</script>
</body>
</html>
